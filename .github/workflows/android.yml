name: Android CI/CD - PréstamoLab CTMA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Dar permisos de ejecución a Gradlew
      run: chmod +x gradlew

    - name: Compilar aplicación (Assemble Debug)
      run: ./gradlew assembleDebug

    - name: Ejecutar Pruebas Unitarias
      run: ./gradlew testDebugUnitTest

    - name: Ejecutar Android Lint (Análisis de Calidad)
      run: ./gradlew lintDebug

    - name: Subir APK de Depuración (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: prestamolab-debug-apk
        path: app/build/outputs/apk/debug/app-debug.png # Cambiar extensión a .apk según estructura de salida de Gradle
